name: coffeeshop

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: coffeeshop-api:local
    build:
      context: .
      dockerfile: src/CoffeeShop.Api/Dockerfile
      args:
        SDK_IMAGE: ${SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0}
    restart: unless-stopped
    environment:
      ConnectionStrings__CoffeeShop: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer in .env}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience in .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "127.0.0.1:${API_PORT:-5232}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  demo-data:
    profiles: [demo]
    image: postgres:18-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ./scripts/postgres/midterm-seed.sql
        target: /demo/seed.sql
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/demo/seed.sql"]

volumes:
  postgres_data:
