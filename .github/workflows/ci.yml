name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CoffeeShop.slnx
      - name: Build
        run: dotnet build CoffeeShop.slnx --no-restore --configuration Release
      - name: Format
        run: dotnet format CoffeeShop.slnx --verify-no-changes --no-restore
      - name: Test
        run: dotnet test CoffeeShop.slnx --no-build --configuration Release

  catalog-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COFFEESHOP_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=test;Password=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Catalog and Customer PostgreSQL Integration Tests
        run: dotnet test tests/CoffeeShop.Infrastructure.Tests --configuration Release --filter "FullyQualifiedName~CatalogPersistenceIntegrationTests|FullyQualifiedName~CustomerLoyaltyPersistenceIntegrationTests"
