name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history and verify credential rejection
        run: bash scripts/verify-secrets.sh

  dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/staff-mobile/.nvmrc
      - name: Audit NuGet and npm dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          dotnet restore CoffeeShop.slnx -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed.' }
          dotnet list CoffeeShop.slnx package --vulnerable --include-transitive --format json > TestResults/nuget-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet audit failed.' }
          foreach ($entry in @(@('mobile', 'apps/staff-mobile'), @('contract', 'contracts/mobile-p0'), @('collection', 'tests/api'))) {
            npm audit --prefix $entry[1] --json > "TestResults/$($entry[0])-audit.json"
            if ($LASTEXITCODE -gt 1) { throw 'npm audit could not run.' }
          }
          node scripts/check-dependency-audit.cjs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Dependency gate self-test failed.' }
          node scripts/check-dependency-audit.cjs TestResults/nuget-audit.json TestResults/mobile-audit.json TestResults/contract-audit.json TestResults/collection-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency policy failed.' }
      - name: Preserve dependency audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: TestResults/*-audit.json
          if-no-files-found: error

  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/staff-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/staff-mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/staff-mobile/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Install mobile dependencies
        run: npm ci
      - name: Type-check mobile app
        run: npm run type-check
      - name: Lint mobile app
        run: npm run lint
      - name: Check mobile formatting
        run: npm run format:check
      - name: Run mobile tests
        run: npm test -- --ci --json --outputFile=mobile-test-results.json
      - name: Run inventory forwarding-harness regressions
        run: npm run test:inventory-harness
      - name: Run workflow forwarding-harness regressions
        run: npm run test:workflow-harness
      - name: Publish mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: apps/staff-mobile/mobile-test-results.json
          if-no-files-found: ignore
      - name: Export Android bundle smoke test
        env:
          EXPO_PUBLIC_APP_ENV: emulator
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:5232/api/v1
        run: npm run smoke:android

  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/staff-mobile
    env:
      EXPO_PUBLIC_APP_ENV: emulator
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:5232/api/v1
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/staff-mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/staff-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned npm and mobile dependencies
        run: |
          npm install --global npm@11.17.0
          npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build native Android application
        working-directory: apps/staff-mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
      - name: Preserve native Android build
        uses: actions/upload-artifact@v4
        with:
          name: staff-mobile-android-debug
          path: apps/staff-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CoffeeShop.slnx -p:Configuration=Release
      - name: Build
        run: dotnet build CoffeeShop.slnx --no-restore --configuration Release
      - name: Verify API-only WinUI Release artifact
        shell: pwsh
        run: .\scripts\verify-winui-api-release.ps1 -SkipBuild
      - name: Format
        run: dotnet format CoffeeShop.slnx --verify-no-changes --no-restore
      - name: Test non-PostgreSQL suites
        shell: pwsh
        run: |
          $projects = @(
            'tests/CoffeeShop.Domain.Tests/CoffeeShop.Domain.Tests.csproj',
            'tests/CoffeeShop.Application.Tests/CoffeeShop.Application.Tests.csproj',
            'tests/CoffeeShop.WinUI.Tests/CoffeeShop.WinUI.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project --no-build --configuration Release --logger "trx;LogFileName=$([IO.Path]::GetFileNameWithoutExtension($project)).trx" --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Summarize CI test split
        if: always()
        shell: pwsh
        run: |
          @"
          ## Test execution split

          - Windows job: Domain, Application, and WinUI suites.
          - PostgreSQL job: Infrastructure and the complete API suite against the PostgreSQL service, including AI HTTP regressions.
          - Do not interpret a single job as the complete test total. Use both job summaries and their TRX artifacts.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Preserve Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: error

  windows-e2e:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the native app, API and desktop tests
        shell: pwsh
        run: |
          dotnet build src/CoffeeShop.WinUI -c Release -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/CoffeeShop.Api -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/CoffeeShop.WinUI.E2E.Tests -c Release
          exit $LASTEXITCODE
      - name: Verify Windows workspace features and sale consistency
        shell: pwsh
        run: ./scripts/test-winui-e2e.ps1
      - name: Preserve Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-evidence
          path: TestResults/WinUI-E2E/

  catalog-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COFFEESHOP_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=test;Password=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Infrastructure and complete midterm demonstration tests
        run: dotnet test tests/CoffeeShop.Infrastructure.Tests --configuration Release --logger "trx;LogFileName=postgres.trx" --results-directory TestResults
      - name: API integration tests against PostgreSQL
        run: dotnet test tests/CoffeeShop.Api.Tests --configuration Release --logger "trx;LogFileName=api-postgres.trx" --results-directory TestResults
      - name: Repeat concurrency tests without skips
        env:
          COFFEESHOP_CONCURRENCY_ITERATIONS: '3'
        run: bash scripts/verify-concurrency.sh
      - name: Preserve PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: |
            TestResults/*.trx
            TestResults/concurrency/
      - name: Summarize PostgreSQL coverage
        if: always()
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## PostgreSQL coverage

          This job runs the Infrastructure suite with `COFFEESHOP_TEST_POSTGRES` configured.
          The Windows job intentionally does not select this suite, so PostgreSQL integration tests are not reported as skipped there.
          EOF

  mobile-p0-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build API for deterministic OpenAPI export
        run: dotnet build src/CoffeeShop.Api --configuration Release
      - name: Install pinned contract generator
        run: npm ci --prefix contracts/mobile-p0
      - name: Verify generated OpenAPI and TypeScript contract
        run: npm run check --prefix contracts/mobile-p0

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/staff-mobile/.nvmrc
          cache: npm
          cache-dependency-path: tests/api/package-lock.json
      - name: Install API collection runner and verify evidence sanitization
        run: npm ci --prefix tests/api && npm test --prefix tests/api
      - name: Verify clean Docker Compose startup, migrations, and demo seed
        run: bash scripts/verify-compose.sh
      - name: Preserve sanitized API collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-api-collection-results
          path: TestResults/api-collection*.json
          if-no-files-found: error
