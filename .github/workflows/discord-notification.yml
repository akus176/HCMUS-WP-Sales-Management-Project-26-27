name: Discord pull request notification

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - review_requested
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_REVIEWER_MAP: ${{ vars.DISCORD_REVIEWER_MAP }}
      DISCORD_REVIEWER_MAP_SECRET: ${{ secrets.DISCORD_REVIEWER_MAP }}
    steps:
      - name: Send Discord notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          action=$(jq -r '.action' "$GITHUB_EVENT_PATH")
          pr_title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
          pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          pr_author=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
          source_branch=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          target_branch=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          pr_url=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")
          pr_body=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          commit_count=$(jq -r '.pull_request.commits' "$GITHUB_EVENT_PATH")
          is_merged=$(jq -r '.pull_request.merged // false' "$GITHUB_EVENT_PATH")

          truncate() {
            local text="$1"
            local limit="$2"

            text="${text//$'\r'/}"
            if [ "${#text}" -le "$limit" ]; then
              printf '%s' "$text"
            else
              printf '%s...' "${text:0:$((limit - 3))}"
            fi
          }

          send_discord() {
            local content="$1"
            local title="$2"
            local url="$3"
            local description="$4"
            local color="$5"
            local fields_json="$6"

            jq -n \
              --arg content "$content" \
              --arg title "$title" \
              --arg url "$url" \
              --arg description "$description" \
              --argjson color "$color" \
              --argjson fields "$fields_json" \
              '{
                content: $content,
                embeds: [
                  ({
                    title: $title,
                    url: $url,
                    color: $color,
                    fields: $fields
                  } + (if $description == "" then {} else {description: $description} end))
                ],
                allowed_mentions: {
                  parse: ["users", "roles"]
                }
              }' > discord-payload.json

            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              --data @discord-payload.json \
              "$DISCORD_WEBHOOK_URL"
          }

          common_fields() {
            local branch_field
            branch_field='`'"$source_branch"'` → `'"$target_branch"'`'

            jq -n \
              --arg author "$pr_author" \
              --arg branch "$branch_field" \
              --arg commits "$commit_count" \
              '[
                {name: "Author", value: $author, inline: true},
                {name: "Branch", value: $branch, inline: false},
                {name: "Commits", value: $commits, inline: true}
              ]'
          }

          send_pr_summary() {
            local heading="$1"
            local color="$2"
            local content
            local description
            local fields

            printf -v content '%s\n\n**[PR #%s] %s**\n\n[View Pull Request](%s)' "$heading" "$pr_number" "$pr_title" "$pr_url"
            description=$(truncate "$pr_body" 1600)
            fields=$(common_fields)

            send_discord \
              "$content" \
              "PR #$pr_number: $pr_title" \
              "$pr_url" \
              "$description" \
              "$color" \
              "$fields"
          }

          send_review_requested() {
            local reviewer_login
            local reviewer_display
            local reviewer_map
            local mapped_reviewer
            local content
            local purpose
            local fields

            reviewer_login=$(jq -r '.requested_reviewer.login // .requested_team.slug // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$reviewer_login" ]; then
              echo "No requested reviewer found in event payload."
              exit 0
            fi

            reviewer_display="$reviewer_login"
            reviewer_map="${DISCORD_REVIEWER_MAP_SECRET:-${DISCORD_REVIEWER_MAP:-}}"
            mapped_reviewer=""

            if [ -n "$reviewer_map" ]; then
              mapped_reviewer=$(jq -r --arg reviewer "$reviewer_login" '.[$reviewer] // empty' <<< "$reviewer_map" 2>/dev/null || true)
            fi

            if [ -n "$mapped_reviewer" ]; then
              reviewer_display="$mapped_reviewer"
            fi

            purpose=$(truncate "${pr_body:-$pr_title}" 500)
            if [ -z "$purpose" ]; then
              purpose="$pr_title"
            fi

            fields=$(jq -n \
              --arg author "$pr_author" \
              --arg purpose "$purpose" \
              '[
                {name: "Author", value: $author, inline: true},
                {name: "Purpose", value: $purpose, inline: false}
              ]')

            printf -v content '**Review Requested**\n\nHey %s, could you please review **[PR #%s] %s**?\n\n[Review Pull Request](%s)' "$reviewer_display" "$pr_number" "$pr_title" "$pr_url"

            send_discord \
              "$content" \
              "Review requested for PR #$pr_number" \
              "$pr_url" \
              "" \
              16753920 \
              "$fields"
          }

          send_commit_update() {
            local before
            local after
            local compare_json
            local new_count
            local commit_lines
            local content
            local description
            local fields

            before=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
            after=$(jq -r '.after // .pull_request.head.sha' "$GITHUB_EVENT_PATH")

            compare_json=""
            if [ -n "$before" ] && [ -n "$after" ]; then
              compare_json=$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$before...$after" || true)
            fi

            new_count=$(jq -r '.commits | length' <<< "${compare_json:-{\"commits\":[]}}" 2>/dev/null || printf '0')
            if [ "$new_count" = "0" ]; then
              description="New commits were pushed to this pull request."
            else
              commit_lines=$(jq -r '
                .commits[:8][]
                | "• [`" + (.sha[0:7]) + "`](" + .html_url + ") - " + (.commit.message | split("\n")[0])
              ' <<< "$compare_json")
              description="+$new_count new commit(s)"
              if [ -n "$commit_lines" ]; then
                printf -v description '%s\n\n%s' "$description" "$commit_lines"
              fi
            fi

            fields=$(jq -n \
              --arg total "$commit_count" \
              '[{name: "Total commits in PR", value: $total, inline: true}]')

            printf -v content '**New commits added to PR #%s**\n\n**%s**\n\n[View PR](%s)' "$pr_number" "$pr_title" "$pr_url"

            send_discord \
              "$content" \
              "New commits on PR #$pr_number" \
              "$pr_url" \
              "$description" \
              3447003 \
              "$fields"
          }

          case "$action" in
            opened)
              send_pr_summary "**New Pull Request**" 5763719
              ;;
            reopened)
              send_pr_summary "**Pull Request Reopened**" 5763719
              ;;
            ready_for_review)
              send_pr_summary "**Pull Request Ready for Review**" 3066993
              ;;
            review_requested)
              send_review_requested
              ;;
            synchronize)
              send_commit_update
              ;;
            closed)
              if [ "$is_merged" = "true" ]; then
                send_pr_summary "✅ **Pull Request Merged**" 3066993
              else
                send_pr_summary "**Pull Request Closed**" 15158332
              fi
              ;;
            *)
              echo "No Discord notification configured for pull_request action: $action"
              ;;
          esac
