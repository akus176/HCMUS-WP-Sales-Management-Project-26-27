appId: com.coffeeshop.staffmobile
name: I202 Android synthetic Manager signs in
---
- launchApp
- extendedWaitUntil:
    visible: Staff mobile
    timeout: 90000
- tapOn: Staff sign-in
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- tapOn:
    id: android:id/autofill_save_no
    optional: true
- extendedWaitUntil:
    visible: Staff home
    timeout: 30000
