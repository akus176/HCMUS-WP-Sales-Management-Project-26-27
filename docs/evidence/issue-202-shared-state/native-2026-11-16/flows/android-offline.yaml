- scrollUntilVisible:
    element: 'Offline.*'
    direction: UP
- extendedWaitUntil:
    visible: 'Offline.*'
    timeout: 30000
- scrollUntilVisible:
    element: Save adjustment
    direction: DOWN
- assertVisible:
