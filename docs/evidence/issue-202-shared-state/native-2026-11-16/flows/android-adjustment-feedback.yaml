appId: com.coffeeshop.staffmobile
name: I202 immediate Android adjustment success feedback
---
- scrollUntilVisible:
    element: Ingredient balances
    direction: UP
- tapOn: Ingredient balances
- scrollUntilVisible:
    element: Record adjustment for I202 Shared Beans
    direction: DOWN
- tapOn: Record adjustment for I202 Shared Beans
- scrollUntilVisible:
    element: Quantity change
    direction: DOWN
- tapOn: Quantity change
- inputText: '1'
- hideKeyboard
- scrollUntilVisible:
    element: Adjustment reason
    direction: DOWN
- tapOn: Adjustment reason
- inputText: I202 immediate feedback verification
- hideKeyboard
- scrollUntilVisible:
    element: Save adjustment
    direction: DOWN
- tapOn: Save adjustment
- extendedWaitUntil:
    visible: 'Adjustment saved by the server. New balance: 108 g.'
    timeout: 12000
- assertVisible: 'Adjustment saved by the server. New balance: 108 g.'
