appId: com.coffeeshop.staffmobile
name: Manager cancellation and ready delivery assignment against the shared API
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff sign-in
    timeout: 60000
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- extendedWaitUntil:
    visible: 'Staff home|Good (morning|afternoon|evening).*'
    timeout: 30000
- tapOn:
    id: workspace-tab-cashier
- tapOn: Search orders
- eraseText
- inputText: ${MAESTRO_CANCEL_ORDER}
- runFlow: usability/hide-keyboard.yaml
- scrollUntilVisible:
    element: Open order ${MAESTRO_CANCEL_ORDER}
    direction: DOWN
- tapOn: Open order ${MAESTRO_CANCEL_ORDER}
- scrollUntilVisible:
    element: Cancellation reason
    direction: DOWN
- tapOn: Cancellation reason
- inputText: Synthetic customer changed plans
- hideKeyboard
- scrollUntilVisible:
    element: Review cancellation
    direction: DOWN
- tapOn: Review cancellation
- scrollUntilVisible:
    element: Confirm cancellation
    direction: DOWN
- tapOn: Confirm cancellation
- scrollUntilVisible:
    element: Cancellation confirmed by the service.
    direction: UP
- assertVisible: Cancellation confirmed by the service.
- takeScreenshot: .maestro/results/manager-cancelled
- tapOn: Back to order search
- tapOn: Search orders
- eraseText
- inputText: ${MAESTRO_DELIVERY_ORDER}
- runFlow: usability/hide-keyboard.yaml
- scrollUntilVisible:
    element: Open order ${MAESTRO_DELIVERY_ORDER}
    direction: DOWN
- tapOn: Open order ${MAESTRO_DELIVERY_ORDER}
- scrollUntilVisible:
    element: Select ${MAESTRO_COURIER_NAME}
    direction: DOWN
- tapOn: Select ${MAESTRO_COURIER_NAME}
- scrollUntilVisible:
    element: Review assignment
    direction: DOWN
- tapOn: Review assignment
- scrollUntilVisible:
    element: Confirm assignment
    direction: DOWN
- tapOn: Confirm assignment
- scrollUntilVisible:
    element: Delivery assignment confirmed by the service.
    direction: UP
- assertVisible: Delivery assignment confirmed by the service.
- takeScreenshot: .maestro/results/manager-assigned
