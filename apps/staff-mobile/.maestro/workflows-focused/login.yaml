appId: com.coffeeshop.staffmobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff sign-in
    timeout: 60000
- tapOn: Username
- eraseText
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- eraseText
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- tapOn:
    id: android:id/autofill_save_no
    optional: true
- extendedWaitUntil:
    visible: 'Staff home|Good (morning|afternoon|evening).*'
    timeout: 30000
