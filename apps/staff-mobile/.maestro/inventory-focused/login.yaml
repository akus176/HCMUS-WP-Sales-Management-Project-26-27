appId: com.coffeeshop.staffmobile
name: Sign in with the dedicated synthetic inventory account
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff mobile
    timeout: 60000
- tapOn: Staff sign-in
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- tapOn:
    text: Thoát
    optional: true
- extendedWaitUntil:
    visible: Staff home
    timeout: 30000
