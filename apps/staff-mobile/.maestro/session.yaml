appId: com.coffeeshop.staffmobile
name: Staff session login, restore, and logout
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff sign-in
    timeout: 60000
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- inputText: deliberately-invalid-test-password
- hideKeyboard
- tapOn: Sign in
- assertVisible: Sign-in failed or your session has expired.
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- extendedWaitUntil:
    visible: Staff home
    timeout: 30000
- assertVisible: ${MAESTRO_STAFF_NAME}
- takeScreenshot: .maestro/results/session-signed-in
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Staff home
    timeout: 30000
- assertVisible: ${MAESTRO_STAFF_NAME}
- scrollUntilVisible:
    element: Sign out
    direction: DOWN
- tapOn: Sign out
- assertVisible: Staff sign-in
- assertNotVisible: ${MAESTRO_STAFF_NAME}
