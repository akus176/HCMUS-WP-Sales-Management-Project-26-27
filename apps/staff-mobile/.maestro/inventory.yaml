appId: com.coffeeshop.staffmobile
name: Low stock, required adjustment reason, receipt posting and history
---
- runFlow: common/login.yaml
- tapOn: Open Inventory
- scrollUntilVisible:
    element: Search ingredients
    direction: DOWN
- tapOn: Search ingredients
- inputText: ${MAESTRO_INGREDIENT}
- runFlow: usability/hide-keyboard.yaml
- scrollUntilVisible:
    element: Open ingredient ${MAESTRO_INGREDIENT}
    direction: DOWN
- tapOn: Open ingredient ${MAESTRO_INGREDIENT}
- scrollUntilVisible:
    element: Record adjustment for ${MAESTRO_INGREDIENT}
    direction: DOWN
- assertVisible: 'Low stock.*'
- tapOn: Record adjustment for ${MAESTRO_INGREDIENT}
- scrollUntilVisible:
    element:
      text: Quantity change
      below: Quantity change
    direction: DOWN
- tapOn:
    text: Quantity change
    below: Quantity change
- inputText: '2'
- runFlow: usability/hide-keyboard.yaml
- scrollUntilVisible:
    element: Save adjustment
    direction: DOWN
- assertVisible:
    text: Save adjustment
    enabled: false
- tapOn: Adjustment reason
- inputText: Quality physical count
- runFlow: usability/hide-keyboard.yaml
- tapOn: Save adjustment
- scrollUntilVisible:
    element: Confirm adjustment
    direction: DOWN
- tapOn: Confirm adjustment
- scrollUntilVisible:
    element: 'Adjustment saved by the server. New balance: 3 l.'
    direction: UP
- assertVisible: 'Adjustment saved by the server. New balance: 3 l.'
- scrollUntilVisible:
    element: Show movement history for ${MAESTRO_INGREDIENT}
    direction: UP
- tapOn: Show movement history for ${MAESTRO_INGREDIENT}
- scrollUntilVisible:
    element: 'adjustment: 2 l · Quality physical count'
    direction: DOWN
- assertVisible: 'adjustment: 2 l · Quality physical count'
- tapOn: Close Movement history · ${MAESTRO_INGREDIENT}
- scrollUntilVisible:
    element: Back to ingredients
    direction: UP
- tapOn: Back to ingredients
- scrollUntilVisible:
    element: Purchase receipts
    direction: UP
- tapOn: Purchase receipts
- scrollUntilVisible:
    element: Review receipt ${MAESTRO_RECEIPT}
    direction: DOWN
- tapOn: Review receipt ${MAESTRO_RECEIPT}
- scrollUntilVisible:
    element: Post receipt ${MAESTRO_RECEIPT}
    direction: DOWN
- tapOn: Post receipt ${MAESTRO_RECEIPT}
- scrollUntilVisible:
    element: Confirm receipt posting
    direction: DOWN
- tapOn: Confirm receipt posting
- scrollUntilVisible:
    element: 'Status: posted'
    direction: UP
- assertVisible: 'Status: posted'
- assertNotVisible: Post receipt ${MAESTRO_RECEIPT}
