appId: com.coffeeshop.staffmobile
name: Delivery app rejects retired staff workflow links
---
- runFlow: common/login.yaml
- assertVisible: Open Deliveries
- assertNotVisible:
    id: workspace-tab-barista
- assertNotVisible:
    id: workspace-tab-cashier
- assertNotVisible:
    id: workspace-tab-inventory
- assertNotVisible: Open Approvals
- openLink: coffeeshop-staff:///notifications/approval/${MAESTRO_RETIRED_RECORD_ID}
- extendedWaitUntil:
    visible: This notification link is unavailable.
    timeout: 30000
- assertNotVisible: Discount review
- tapOn: Today
- tapOn: More
- tapOn: Open Account
- scrollUntilVisible:
    element: Sign out
    direction: DOWN
- tapOn: Sign out
- tapOn: Confirm sign out
- assertVisible: Staff sign-in
- openLink: coffeeshop-staff:///notifications/approval/${MAESTRO_RETIRED_RECORD_ID}
- assertVisible: Staff sign-in
- assertNotVisible: Discount review
