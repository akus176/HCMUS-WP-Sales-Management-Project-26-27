appId: com.coffeeshop.staffmobile
name: Approve and reject discounts against the shared API
---
- runFlow: common/login.yaml
- runFlow:
    when:
      visible: More
    commands:
      - tapOn: More
- tapOn: Open Approvals
- scrollUntilVisible:
    element: Review order ${MAESTRO_APPROVE_ORDER} discount
    direction: DOWN
- tapOn: Review order ${MAESTRO_APPROVE_ORDER} discount
- scrollUntilVisible:
    element: Approve discount
    direction: DOWN
- tapOn: Approve discount
- scrollUntilVisible:
    element: Confirm discount approval
    direction: DOWN
- tapOn: Confirm discount approval
- scrollUntilVisible:
    element: 'Approved by the server. Confirmed order total: 9.'
    direction: UP
- assertVisible: 'Approved by the server. Confirmed order total: 9.'
- tapOn: Back to pending approvals
- scrollUntilVisible:
    element: Review order ${MAESTRO_REJECT_ORDER} discount
    direction: DOWN
- tapOn: Review order ${MAESTRO_REJECT_ORDER} discount
- scrollUntilVisible:
    element: Reject discount
    direction: DOWN
- tapOn: Reject discount
- scrollUntilVisible:
    element: Confirm discount rejection
    direction: DOWN
- tapOn: Confirm discount rejection
- scrollUntilVisible:
    element: 'Rejected by the server. Confirmed order total: 10.'
    direction: UP
- assertVisible: 'Rejected by the server. Confirmed order total: 10.'
