appId: com.coffeeshop.staffmobile
name: Account detail entry, return, rejection and security events
---
- runFlow: login.yaml
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Open Administration
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Open Administration
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/accounts
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: View details for Audit Admin 219
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: View details for Audit Admin 219
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/account-entry
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Account details
      MAESTRO_SCROLL_DIRECTION: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/account-detail
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Close account details
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Close account details
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Deactivate Audit Admin 219
      MAESTRO_SCROLL_DIRECTION: UP
- tapOn: Deactivate Audit Admin 219
- tapOn:
    text: Deactivate
    index: 0
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: 'This account cannot be deactivated.*'
      MAESTRO_SCROLL_DIRECTION: DOWN
- assertVisible: 'This account cannot be deactivated.*'
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/deactivation-error
- runFlow:
    when:
      true: ${MAESTRO_UX_AFTER == 'true'}
    commands:
      - scrollUntilVisible:
          element: Security events
          direction: UP
      - tapOn: Security events
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Sign-in failures
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Sign-in failures
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/security-events
