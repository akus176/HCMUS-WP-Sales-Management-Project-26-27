appId: com.coffeeshop.staffmobile
name: Staff sign-in, visible form labels and keyboard
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff mobile
    timeout: 60000
- tapOn: Staff sign-in
- assertVisible: Username
- assertVisible: Password
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/login
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Username
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/login-keyboard
- runFlow: hide-keyboard.yaml
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Password
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Sign in
      MAESTRO_SCROLL_DIRECTION: DOWN
- tapOn: Sign in
- extendedWaitUntil:
    visible: Staff home
    timeout: 30000
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/home
