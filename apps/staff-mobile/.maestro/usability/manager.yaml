appId: com.coffeeshop.staffmobile
name: Updated operational navigation, filters and review forms
---
- runFlow: before.yaml
- scrollUntilVisible:
    element: Search orders
    direction: DOWN
- tapOn: Search orders
- inputText: ${MAESTRO_PAYMENT_ORDER}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Open order ${MAESTRO_PAYMENT_ORDER}
    direction: DOWN
- tapOn: Open order ${MAESTRO_PAYMENT_ORDER}
- scrollUntilVisible:
    element: Payment amount
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/payment
- tapOn: Payment amount
- inputText: '5'
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/payment-keyboard
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Review payment
    direction: DOWN
- tapOn: Review payment
- scrollUntilVisible:
    element: Confirm payment
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/payment-review
- scrollUntilVisible:
    element: Back to order search
    direction: UP
- tapOn: Back to order search
- scrollUntilVisible:
    element: 'Filter orders: All'
    direction: UP
- tapOn: 'Filter orders: All'
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/filters-expanded
- scrollUntilVisible:
    element: Show ready orders
    direction: DOWN
- tapOn: Show ready orders
- assertVisible: 'Filter orders: Ready'
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/filter-selected
- openLink: coffeeshop-staff:///modules/approvals
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/approvals
- scrollUntilVisible:
    element: Review order ${MAESTRO_APPROVE_ORDER} discount
    direction: DOWN
- tapOn: Review order ${MAESTRO_APPROVE_ORDER} discount
- scrollUntilVisible:
    element: Approve discount
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/approval-detail
- openLink: coffeeshop-staff:///modules/approvals/operations
- scrollUntilVisible:
    element: Search orders
    direction: DOWN
- tapOn: Search orders
- inputText: ${MAESTRO_CANCEL_ORDER}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Open order ${MAESTRO_CANCEL_ORDER}
    direction: DOWN
- tapOn: Open order ${MAESTRO_CANCEL_ORDER}
- scrollUntilVisible:
    element: Cancellation reason
    direction: DOWN
- tapOn: Cancellation reason
- inputText: Usability audit only
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/cancellation-keyboard
- hideKeyboard
- scrollUntilVisible:
    element: Review cancellation
    direction: DOWN
- tapOn: Review cancellation
- scrollUntilVisible:
    element: Confirm cancellation
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/cancellation-review
- tapOn: Keep current order
# Start a fresh view: tapping a long order ID can place the caret midway through
# the existing value, so eraseText alone does not reliably clear the search.
- launchApp
- extendedWaitUntil:
    visible: Open Approvals
    timeout: 30000
- tapOn: Open Approvals
- tapOn: Manage cancellations and deliveries
- scrollUntilVisible:
    element: Search orders
    direction: DOWN
- tapOn: Search orders
- inputText: ${MAESTRO_DELIVERY_ORDER}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Open order ${MAESTRO_DELIVERY_ORDER}
    direction: DOWN
- tapOn: Open order ${MAESTRO_DELIVERY_ORDER}
- scrollUntilVisible:
    element: Select ${MAESTRO_COURIER_NAME}
    direction: DOWN
- tapOn: Select ${MAESTRO_COURIER_NAME}
- scrollUntilVisible:
    element: Review assignment
    direction: DOWN
- tapOn: Review assignment
- scrollUntilVisible:
    element: Confirm assignment
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/assignment-review
