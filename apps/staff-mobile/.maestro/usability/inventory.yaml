appId: com.coffeeshop.staffmobile
name: Inventory sections, labelled adjustment and receipt review
---
- runFlow: login.yaml
- scrollUntilVisible:
    element: Open Inventory
    direction: DOWN
- tapOn: Open Inventory
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/inventory
- scrollUntilVisible:
    element: Low stock
    direction: DOWN
- tapOn: Low stock
- scrollUntilVisible:
    element: Search ingredients
    direction: DOWN
- tapOn: Search ingredients
- inputText: ${MAESTRO_INGREDIENT}
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Record adjustment for ${MAESTRO_INGREDIENT}
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/low-stock
- tapOn: Record adjustment for ${MAESTRO_INGREDIENT}
- scrollUntilVisible:
    element: Quantity change
    direction: DOWN
- tapOn: Quantity change
- inputText: '2'
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/adjustment-keyboard
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Adjustment reason
    direction: DOWN
- tapOn: Adjustment reason
- inputText: Usability audit only
- runFlow: hide-keyboard.yaml
- scrollUntilVisible:
    element: Save adjustment
    direction: DOWN
- assertVisible:
    text: Save adjustment
    enabled: true
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/adjustment
- scrollUntilVisible:
    element: Purchase receipts
    direction: UP
- tapOn: Purchase receipts
- scrollUntilVisible:
    element: Review receipt ${MAESTRO_RECEIPT}
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/receipts
- tapOn: Review receipt ${MAESTRO_RECEIPT}
- scrollUntilVisible:
    element: Post receipt ${MAESTRO_RECEIPT}
    direction: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/receipt-detail
- scrollUntilVisible:
    element: Movement history
    direction: UP
- tapOn: Movement history
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/movements
