appId: com.coffeeshop.staffmobile
name: Original preparation, Counter and payment layout
---
- runFlow: login.yaml
- openLink: coffeeshop-staff:///modules/barista
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/prep-top
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Open ticket ${MAESTRO_ORDER_NUMBER}
      MAESTRO_SCROLL_DIRECTION: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/prep-record
- tapOn: Open ticket ${MAESTRO_ORDER_NUMBER}
- runFlow:
    file: scroll-to.yaml
    env:
      MAESTRO_SCROLL_TARGET: Start preparing
      MAESTRO_SCROLL_DIRECTION: DOWN
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/prep-detail
- openLink: coffeeshop-staff:///modules/cashier
- takeScreenshot: ${MAESTRO_CAPTURE_DIR}/counter
