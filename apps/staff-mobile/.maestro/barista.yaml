appId: com.coffeeshop.staffmobile
name: Barista progression against the shared API
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Staff sign-in
    timeout: 60000
- tapOn: Username
- inputText: ${MAESTRO_STAFF_USERNAME}
- hideKeyboard
- tapOn: Password
- inputText: ${MAESTRO_STAFF_PASSWORD}
- hideKeyboard
- tapOn: Sign in
- extendedWaitUntil:
    visible: Open Preparation
    timeout: 30000
- tapOn: Open Preparation
- scrollUntilVisible:
    element: Open selected ticket
    direction: DOWN
- assertVisible:
    text: Open selected ticket
    enabled: false
- scrollUntilVisible:
    element:
      id: preparation-filter-confirmed
    direction: UP
- tapOn:
    id: preparation-filter-confirmed
- scrollUntilVisible:
    element:
      id: preparation-filter-preparing
    direction: UP
- tapOn:
    id: preparation-filter-preparing
- scrollUntilVisible:
    element:
      id: preparation-filter-active
    direction: UP
- tapOn:
    id: preparation-filter-active
- repeat:
    times: ${MAESTRO_QUEUE_PAGE_SKIP}
    commands:
      - scrollUntilVisible:
          element: Next page
          direction: DOWN
      - tapOn: Next page
- scrollUntilVisible:
    element:
      id: preparation-filter-active
    direction: UP
- scrollUntilVisible:
    element: Select ticket ${MAESTRO_ORDER_NUMBER}
    direction: DOWN
- tapOn: Select ticket ${MAESTRO_ORDER_NUMBER}
- scrollUntilVisible:
    element: Open ${MAESTRO_ORDER_NUMBER}
    direction: DOWN
- assertVisible:
    text: Open ${MAESTRO_ORDER_NUMBER}
    enabled: true
- tapOn: Open ${MAESTRO_ORDER_NUMBER}
- scrollUntilVisible:
    element: Large
    direction: DOWN
- assertVisible: Large
- scrollUntilVisible:
    element: 'Add-ons: ${MAESTRO_BARISTA_ADDON}'
    direction: DOWN
- assertVisible: 'Add-ons: ${MAESTRO_BARISTA_ADDON}'
- scrollUntilVisible:
    element: Back to Preparation
    direction: UP
- tapOn: Back to Preparation
- scrollUntilVisible:
    element: Open ${MAESTRO_ORDER_NUMBER}
    direction: DOWN
- assertVisible:
    text: Open ${MAESTRO_ORDER_NUMBER}
    enabled: true
- tapOn: Open ${MAESTRO_ORDER_NUMBER}
- scrollUntilVisible:
    element: Start preparing
    direction: DOWN
- assertVisible: 'Status: Confirmed'
- takeScreenshot: .maestro/results/barista-confirmed
- tapOn: Start preparing
- scrollUntilVisible:
    element: Confirm start
    direction: DOWN
- tapOn: Confirm start
- scrollUntilVisible:
    element: 'Status: Preparing'
    direction: UP
- scrollUntilVisible:
    element: Mark ready
    direction: DOWN
- takeScreenshot: .maestro/results/barista-preparing
- tapOn: Mark ready
- assertVisible: This updates the whole ticket.
- scrollUntilVisible:
    element: Keep preparing
    direction: DOWN
- takeScreenshot: .maestro/results/barista-ready-review
- tapOn: Keep preparing
- assertNotVisible: Confirm ready
- scrollUntilVisible:
    element: Mark ready
    direction: DOWN
- tapOn: Mark ready
- scrollUntilVisible:
    element: Confirm ready
    direction: DOWN
- tapOn: Confirm ready
- scrollUntilVisible:
    element: Ticket is Ready. Confirmed by the service.
    direction: UP
- assertVisible: Ticket is Ready. Confirmed by the service.
- takeScreenshot: .maestro/results/barista-ready
